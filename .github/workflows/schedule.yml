name: Update schedule

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run schedule
      - name: Commit if changed
        run: |
          git diff --quiet -- data/schedule.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "data: schedule $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
